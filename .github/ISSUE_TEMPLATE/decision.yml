name: Decision
description: Something only the owner can settle. Always a sub-issue, never standalone.
type: Decision
body:
  - type: markdown
    attributes:
      value: |
        **This is Interface 2.** A run has found something it may not decide, so it stops, asks,
        and releases what it was holding.

        **Answering is a field, not a comment.** Set `Answer` — `Option A` … `Option D`, or
        `None of the above` when the real answer is "A, but with B's wording". The run reads that
        field; it does not parse prose. **A Decision closed with no `Answer` does not resume the
        work** — it re-parks, because guessing which letter was meant is the failure this whole
        mechanism exists to avoid.

        **Then leave it open.** The harness closes it when the work actually restarts, so closed
        means "resumed with this answer" rather than "somebody read it". An answered issue still
        open is visibly waiting to be picked up; one closed with the run never restarted looks
        finished, and nothing goes looking for it.

        Say *why* in a comment. That is worth keeping and nothing has to read it.

        **More than four options means the question is not ready.** Neither is one: a question
        with a single option is a report.

        **Link it as a sub-issue of the work it holds up**, once filed. That link is what puts it
        on the board and makes the parent read "0 of 1".
  - type: textarea
    id: summary
    attributes:
      label: Executive summary
      description: >
        For the owner, who answers on this alone. Under 80 words, in plain words: the question in one sentence, two to four options, and the one recommended. The lettered options with their costs go in Options below.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: >
        Each option under its own `### Option A — <the choice>` heading, B, C and D the same,
        with what it costs — lines of change, suites touched, anything it would foreclose. The
        headings are load-bearing: the `Answer` field selects a letter, and tools read the option
        under it.
      placeholder: |
        ### Option A — Export straight away, capped at 10,000 rows
        Quick to build; a large account gets part of its data and a message saying so.
        *~40 lines, 1 suite.*

        ### Option B — Build the export in the background and email a link
        Handles any size; needs a background job and an email.
        *~200 lines, a new job.*
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: >
        Why the option the summary recommends is the right one. **Never leave this empty** — an unanswered question with no
        recommendation makes the owner do the thinking the run had already done.
    validations:
      required: true
  - type: textarea
    id: blocking
    attributes:
      label: What this is holding up
      description: >
        What cannot proceed meanwhile, so the owner can price answering it. Say if the answer is
        "nothing" — a Decision that blocks nothing did not need to stop a run.
    validations:
      required: false
