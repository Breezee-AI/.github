name: Secret scan

# gitleaks over the commits each pull request and push adds. The organisation's
# ruleset requires the check "secret-scan / Gitleaks" on every repository.
# Other repositories call the shared workflow in Breezee-AI/packages; this one is
# public and GitHub won't let it call a private repository's workflow, so it
# calls its own copy, gitleaks.yml. Keep that copy in step with
# Breezee-AI/packages/.github/workflows/secret-scan.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/gitleaks.yml
